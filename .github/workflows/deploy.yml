name: Build and Test Alchemy Docs

on:
  push:
    branches: [main, issues1]
  pull_request:
    branches: [main, issues1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook and linkcheck
        run: |
          curl -L https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.cargo/bin/
          curl -L https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip -o /tmp/linkcheck.zip
          unzip -o /tmp/linkcheck.zip -d $HOME/.cargo/bin/
          chmod +x $HOME/.cargo/bin/mdbook*

      - name: Build Everything (Docs + Next.js)
        run: ./build.sh

      - name: Verify build output
        run: |
          test -f landing/out/index.html
          test -f landing/out/docs/index.html
          test -f landing/out/docs/searchindex.js
          test -f landing/out/docs/hackathon-alchemy/01-AI-ML/README.html
          test -f landing/out/docs/builder-alchemy/README.html
          echo "Build verified successfully."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-docs-build
          path: landing/out/
